<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <section class="info">
        <h1>Teen IT Day</h1>
        <p class="info-text">Подія для підлітків, які хочуть дізнатися більше про світ технологій, познайомитись з
            IT-професіями та спробувати себе в сучасних напрямках.</p>
        <div class="card-info">
            <i class="bi bi-calendar"></i>
            <div class="dmd1">
                <h3>Дата</h3>
                <p>25 вересня 2026 року</p>
            </div>
        </div>

        <div class="card-info">
            <i class="bi bi-geo-alt-fill"></i>
            <div class="dmd2">
                <h3>Місце</h3>
                <p>Київ IT хаб (вул. Центральна 25)</p>
            </div>
        </div>

        <div class="card-info">
            <i class="bi bi-people-fill"></i>
            <div class="dmd3">
                <h3>Для кого</h3>
                <p>Учні 7-11 класів</p>
            </div>
        </div>
        <img src="./img/photo1.png" alt="photo1">
    </section>

    <section class="registration">
        <h2>Реєстрація на Teen IT Day</h2>
        <h3>Ім'я</h3>
        <input type="text" id="name" placeholder="Введіть ваше ім'я">
        <h3>email</h3>
        <input type="email" id="email" placeholder="example@gmail.com">
        <div class="form-group">
            <label for="direction">Напрям</label>
            <select id="direction">
                <option>Оберіть напрям</option>
                <option>Програмування</option>
                <option>Дизайн</option>
                <option>Робототехніка</option>
                <option>3D-моделювання</option>
            </div>
                <div class="qwe">
                    <input type="checkbox" id="agree" class="rty">
                    <label for="agree" class="uio">Я погоджуюсь з
                        <a href="#">правилами заходу</a>
                    </label>
                </div>
                <button class="button">Зареєструватись</button>
            </select>
    </section>
</body>

</html>
